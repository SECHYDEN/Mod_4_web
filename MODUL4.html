<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jawaban Soal Praktik TP Modul 4</title>

  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-light">

  <!-- ==========================================
       SOAL 1: NAVBAR BOOTSTRAP
       ========================================== -->
  <!-- Navbar dibuat responsif dengan d-flex justify-content-between -->
  <nav class="navbar navbar-dark bg-dark mb-5">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <!-- a. Text "TP Modul 4" pada ujung kiri -->
      <a class="navbar-brand" href="#">TP Modul 4</a>

      <!-- b. Search bar pada ujung kanan (dipastikan selalu muncul di desktop & mobile) -->
      <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
    </div>
  </nav>

  <div class="container mb-5">

    <!-- ==========================================
         SOAL 2: FORM TAILWIND CSS
         ========================================== -->
    <!-- d. w-full (100% di mobile) & md:w-1/2 (50% dari parent di layar desktop) -->
    <!-- e. mx-auto (berada di tengah halaman) -->
    <div class="w-full md:w-1/2 mx-auto bg-white p-6 rounded-lg shadow-sm border mb-10">
      
      <!-- a. Text "Form Pendaftaran" pada tengah atas form -->
      <h2 class="text-xl font-bold text-center mb-6 text-gray-800">Form Pendaftaran</h2>

      <form action="#">
        <!-- b. 3 textfield dengan <label> terhubung benar & src="input" -->
        <div class="mb-4">
          <label for="nama" class="block text-sm font-medium text-gray-700 mb-1">Nama</label>
          <input type="text" id="nama" name="nama" src="input" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="mb-4">
          <label for="nim" class="block text-sm font-medium text-gray-700 mb-1">NIM</label>
          <input type="text" id="nim" name="nim" src="input" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="mb-6">
          <label for="angkatan" class="block text-sm font-medium text-gray-700 mb-1">Angkatan</label>
          <input type="text" id="angkatan" name="angkatan" src="input" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- c. 2 tombol terletak pada bagian ujung kanan form -->
        <div class="flex justify-end gap-2">
          <button type="button" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md font-medium text-sm">Cancel</button>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md font-medium text-sm">Submit</button>
        </div>
      </form>
    </div>

    <!-- ==========================================
         SOAL 3: TABLE BOOTSTRAP
         ========================================== -->
    <div class="w-full">
      <!-- a. Text "Data Mahasiswa" pada tengah atas table -->
      <h2 class="text-center mb-4 font-bold text-gray-800 fs-3">Data Mahasiswa</h2>

      <!-- d. Menggunakan .table-hover dan .table-bordered -->
      <div class="table-responsive">
        <table class="table table-dark table-hover table-bordered align-middle">
          <thead>
            <!-- b. Minimal 4 kolom pada header table -->
            <tr>
              <th scope="col">No</th>
              <th scope="col">Nama</th>
              <th scope="col">NIM</th>
              <th scope="col">Angkatan</th>
            </tr>
          </thead>
          <tbody>
            <!-- c. Minimal 3 data dummy -->
            <tr>
              <th scope="row">1</th>
              <td>Budi</td>
              <td>1302990000</td>
              <td>1999</td>
            </tr>
            <tr>
              <th scope="row">2</th>
              <td>Cahyo</td>
              <td>1302212000</td>
              <td>2021</td>
            </tr>
            <tr>
              <th scope="row">3</th>
              <td>Dudi</td>
              <td>1302201040</td>
              <td>2020</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
